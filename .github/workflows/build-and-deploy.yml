name: Build and deploy backend

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to (re)deploy, e.g. sha-1a2b3c4. Leave empty to build and deploy this branch."
        required: false
        type: string

# Never let two deploys touch the host at the same time.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: youtubecounter-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Resolve image coordinates
        id: meta
        env:
          # Passed as an environment variable, not interpolated into the script, so a
          # crafted dispatch input cannot become shell code.
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          image=$(printf 'ghcr.io/%s/%s' "$GITHUB_REPOSITORY_OWNER" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          tag="${REQUESTED_TAG:-sha-${GITHUB_SHA::7}}"
          case "$tag" in
            *[!A-Za-z0-9._-]*) echo "::error::'$tag' is not a valid image tag"; exit 1 ;;
          esac
          {
            echo "image=$image"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      # Skipped when re-deploying an existing tag through workflow_dispatch.
      - name: Build image
        if: ${{ !inputs.tag }}
        run: |
          chmod +x ./gradlew   # gradlew is tracked without the executable bit
          ./gradlew :server:publishImageToLocalRegistry

      # Pull requests stop here: the build is the check. Fork PRs run with a
      # read-only token and no access to secrets, so nothing below can run for them.
      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' && !inputs.tag }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        if: ${{ github.event_name != 'pull_request' && !inputs.tag }}
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # The ktor plugin tags the local image with both the project version and
          # :latest; :latest is the one we know is always there.
          docker tag "$IMAGE_NAME:latest" "$IMAGE:$TAG"
          docker tag "$IMAGE_NAME:latest" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io || true

  deploy:
    needs: build
    # Only ever from master on this repository. `pull_request` events - including
    # ones opened from forks - can never reach this job, and therefore never reach
    # the deployment secrets.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://youtubecounter.cororo.ru
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Secrets are handed over as environment variables and quoted here, never
          # interpolated into the script body, so their contents cannot be parsed as shell.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/youtubecounter/deploy.sh $TAG"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy
