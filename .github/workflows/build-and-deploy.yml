name: Build and deploy backend

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Rebuild and redeploy the current branch on demand. Redeploying an *older*
  # image is done on the server (pin APP_TAG, redeploy) - CI only ships `latest`.
  workflow_dispatch:

# Never let two deploys touch the host at the same time.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: youtubecounter-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Resolve image coordinates
        id: meta
        run: |
          image=$(printf 'ghcr.io/%s/%s' "$GITHUB_REPOSITORY_OWNER" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "image=$image"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          chmod +x ./gradlew   # gradlew is tracked without the executable bit
          ./gradlew :server:publishImageToLocalRegistry

      # Pull requests stop here: the build is the check. Fork PRs run with a
      # read-only token and no access to secrets, so nothing below can run for them.
      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Both tags are pushed: `sha-<short>` is the immutable record of what was
      # built, `latest` is what the server actually deploys.
      - name: Push image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # The ktor plugin tags the local image with both the project version and
          # :latest; :latest is the one we know is always there.
          docker tag "$IMAGE_NAME:latest" "$IMAGE:$TAG"
          docker tag "$IMAGE_NAME:latest" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io || true

  deploy:
    needs: build
    # Only ever from master on this repository. `pull_request` events - including
    # ones opened from forks - can never reach this job, and therefore never reach
    # the deployment secret.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://youtubecounter.cororo.ru
    steps:
      # CI does not touch the host: it POSTs to a single deploy webhook and the
      # server redeploys itself from this repository. The compose file sets
      # `pull_policy: always`, so the redeploy picks up the `latest` image this
      # run just pushed.
      #
      # The webhook URL is the whole secret - it carries an unguessable path and
      # the service's deploy token, and it is the only endpoint of the deployment
      # machinery reachable from the internet.
      - name: Trigger deployment
        env:
          WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DEPLOY_WEBHOOK is not set"
            exit 1
          fi
          # The URL is passed through an environment variable and quoted, never
          # interpolated into the script body, so it cannot become shell code and
          # does not end up in the run log.
          #
          # The payload is not optional. The server deploys the compose file from
          # this repository, so it checks the pushed ref against the branch it
          # tracks; with an empty body it refuses - and it does so with HTTP 301,
          # which reads like a redirect rather than a refusal.
          code=$(curl -sS -o response.txt -w '%{http_code}' --max-time 180 \
                      -X POST \
                      -H 'Content-Type: application/json' \
                      -H 'X-GitHub-Event: push' \
                      -d "{\"ref\":\"$GITHUB_REF\"}" \
                      "$WEBHOOK")
          cat response.txt
          if [ "$code" != "200" ]; then
            echo "::error::deploy webhook answered HTTP $code"
            exit 1
          fi
