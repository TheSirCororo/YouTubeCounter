name: Build desktop app

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two quick pushes cannot race to create the same tag.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides what to build and whether this run publishes anything. The tag is
  # created later, in the release job, rather than by a separate workflow: a tag
  # pushed with GITHUB_TOKEN does not trigger other workflows, so a "tag now,
  # build on the tag event" split would tag the commit and then quietly do nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to see which versions were already released

      - name: Resolve version
        id: resolve
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Re-running an existing tag: publish exactly that.
            version=${GITHUB_REF_NAME#v}
            release=true
          else
            version=$(sed -n 's/^version=//p' gradle.properties | tail -n 1)
            release=false
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "v$version is already tagged - nothing to release"
              else
                release=true
              fi
            fi
          fi

          # jpackage only accepts numeric versions, and a bad one would fail four
          # OS builds several minutes in.
          if [[ ! $version =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::'$version' is not a version jpackage can package"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Building $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            tasks: packageReleaseMsi
          - name: macos-arm64
            os: macos-latest
            tasks: packageReleaseDmg
          # macos-latest is Apple Silicon; the -intel label is the x64 image.
          - name: macos-x64
            os: macos-26-intel
            tasks: packageReleaseDmg
          - name: linux-x64
            os: ubuntu-latest
            tasks: packageReleaseDeb packageReleaseRpm packageReleaseAppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      # jpackage shells out to the native packaging tools; ubuntu images ship dpkg
      # and fakeroot but not rpmbuild.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot

      # jpackage's msi bundler needs WiX 3. Installed only if the runner image
      # stopped shipping it, so this is a no-op on images that still do.
      - name: Ensure WiX 3 is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 --no-progress -y
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Package
        shell: bash
        run: |
          chmod +x ./gradlew   # gradlew is tracked without the executable bit
          ./gradlew ${{ matrix.tasks }} -PappVersion=${{ needs.version.outputs.version }}

      # Both macOS legs produce an identically named .dmg, so the platform goes
      # into the file name before anything is uploaded.
      - name: Collect packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          out=composeApp/build/compose/binaries/main-release
          mkdir -p dist
          for f in "$out"/dmg/*.dmg; do
            [ -e "$f" ] || continue
            cp "$f" "dist/$(basename "$f" .dmg)-$PLATFORM.dmg"
          done
          for f in "$out"/deb/*.deb "$out"/rpm/*.rpm; do
            if [ -e "$f" ]; then cp "$f" dist/; fi
          done
          # TargetFormat.AppImage is jpackage's app-image: a directory, not a bundle.
          # Ship it as a tarball so people on other distros have something portable.
          if [ -d "$out/app/YouTubeCounter" ]; then
            tar -C "$out/app" -czf "dist/YouTubeCounter-$PLATFORM.tar.gz" YouTubeCounter
          fi

      - name: Collect packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          $out = "composeApp/build/compose/binaries/main-release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem "$out/msi/*.msi" | ForEach-Object {
            Copy-Item $_.FullName "dist/$($_.BaseName)-$env:PLATFORM.msi"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeCounter-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [ version, package ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # On a version bump this is what creates v1.0.5; on a re-run of an existing
      # tag it is already there and this is a no-op.
      - name: Tag the release
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "YouTubeCounter $TAG"
            git push origin "$TAG"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "YouTubeCounter $TAG" \
              --generate-notes
          fi
