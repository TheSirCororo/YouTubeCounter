ktor {
  development = false

  deployment {
    host = "0.0.0.0"
    port = 8080
    port = ${?SERVER_PORT}
  }

  application {
    modules = [ru.cororo.youtubecounter.GoogleAuthorizationServerKt.module]
  }
}

google {
  client_id = ${?GOOGLE_CLIENT_ID}
  client_secret = ${?GOOGLE_CLIENT_SECRET}
}

storage {
  # Relative by default, so `./gradlew :server:run` works without a writable /data.
  # In the container docker-compose.yml sets TOKENS_DB_PATH to /data/tokens.db,
  # which is a mounted volume and therefore survives a redeploy.
  database_path = "data/tokens.db"
  database_path = ${?TOKENS_DB_PATH}
}
