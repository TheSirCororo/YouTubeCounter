# Compose-файл сервиса в Dokploy. Копия того, что хранится в самом Dokploy
# (проект services, сервис youtubecounter) — здесь он лежит, чтобы изменения
# проходили через ревью, а не только через веб-интерфейс.
#
# Тип сервиса в Dokploy — Compose, а не Application, и это важно: Compose
# разворачивается обычным `docker compose`, поэтому работает tmpfs с exec
# (см. ниже). В Swarm-приложении задать exec для tmpfs нельзя вообще.
services:
  backend:
    # Тег подставляет deploy.sh через переменные окружения Dokploy.
    image: ${APP_IMAGE}:${APP_TAG}
    container_name: youtubecounter-backend
    restart: unless-stopped

    # Обязательно, не украшение. Dokploy разворачивает стек командой
    # `docker compose up -d --build`, без отдельного `pull`. С плавающим
    # тегом (latest) docker взял бы локально закешированный образ, и деплой
    # «успешно» поднимал бы старый код. pull_policy заставляет тянуть заново.
    pull_policy: always

    # Секреты приходят из переменных окружения Dokploy: в образ ничего
    # не вшито, в командной строке не светится.
    environment:
      TOKENS_DB_PATH: /data/tokens.db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

    # Только на loopback. Наружу сервис отдаёт nginx на хосте, а маршрутизацию
    # по имени делает Traefik Dokploy. Этот порт оставлен ради прямой проверки
    # контейнера мониторингом, в обход всей цепочки.
    ports:
      - "127.0.0.1:${HOST_PORT}:8080"

    # Том с refresh-токенами объявлен внешним намеренно: это тот же том, что
    # был у стека до переезда в Dokploy, поэтому пользователи не разлогинились.
    volumes:
      - tokens:/data

    networks:
      - default
      - monitoring

    security_opt:
      - no-new-privileges:true

    # exec обязателен, это не украшение: docker монтирует tmpfs с noexec,
    # а sqlite-jdbc распаковывает нативную библиотеку в java.io.tmpdir и
    # делает dlopen. С обычным `- /tmp` контейнер падает на старте с
    # NativeLibraryNotFoundException.
    tmpfs:
      - /tmp:exec

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tokens:
    external: true
    name: youtubecounter_tokens

# Сеть мониторинга: Uptime Kuma проверяет контейнер напрямую по имени.
networks:
  monitoring:
    external: true
