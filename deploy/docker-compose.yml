# Compose-файл сервиса. Сервер разворачивает ИМЕННО ЭТОТ файл прямо из
# репозитория, так что здесь источник правды, а не копия: правка едет
# через коммит и ревью.
#
# Разворачивается обычным `docker compose` — это важно, потому что только
# так работает tmpfs с exec (см. ниже).
services:
  backend:
    # Тег приходит из переменных окружения сервиса на сервере.
    image: ${APP_IMAGE}:${APP_TAG}
    container_name: youtubecounter-backend
    restart: unless-stopped

    # Обязательно, не украшение. Стек разворачивается командой
    # `docker compose up -d --build`, без отдельного `pull`. С плавающим
    # тегом (latest) docker взял бы локально закешированный образ, и деплой
    # «успешно» поднимал бы старый код. pull_policy заставляет тянуть заново.
    pull_policy: always

    # Секреты приходят из переменных окружения сервиса: в образ ничего
    # не вшито, в командной строке не светится.
    environment:
      TOKENS_DB_PATH: /data/tokens.db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

    # Только на loopback: наружу сервис отдаёт обратный прокси на хосте.
    # Этот порт оставлен ради прямой проверки контейнера мониторингом,
    # в обход всей цепочки.
    ports:
      - "127.0.0.1:${HOST_PORT}:8080"

    # Том с refresh-токенами объявлен внешним намеренно: он переживает
    # пересоздание стека, поэтому пользователи не разлогиниваются.
    volumes:
      - tokens:/data

    networks:
      - default
      - monitoring

    security_opt:
      - no-new-privileges:true

    # exec обязателен, это не украшение: docker монтирует tmpfs с noexec,
    # а sqlite-jdbc распаковывает нативную библиотеку в java.io.tmpdir и
    # делает dlopen. С обычным `- /tmp` контейнер падает на старте с
    # NativeLibraryNotFoundException.
    tmpfs:
      - /tmp:exec

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tokens:
    external: true
    name: youtubecounter_tokens

# Сеть мониторинга: контейнер проверяется напрямую по имени.
networks:
  monitoring:
    external: true
